[project]
name = "ai-paper-qa"
version = "0.1.0"
description = "RAG backend for question answering over papers and technical documents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "sentence-transformers>=6.0",
]

# NOTE on torch: sentence-transformers pulls in torch as a dependency, and a plain
# `pip install` on Windows resolves the CUDA build (~2.5 GB). This project uses a
# CPU-only build on purpose -- see README for the install command. Install torch
# from the official CPU index BEFORE running `pip install -e .`:
#   pip install --index-url https://download.pytorch.org/whl/cpu torch

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
